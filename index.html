<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Juliana Shi</title>
</head>
<body>
    <div class="poster">
 
  <!-- Top label -->
  <div class="label-top">
    Juliana Shi<br>
    St.Louis, Missouri <br>
  </div>
 
  <!-- ── Big scattered typography ── -->
 
  <!-- (Juliana -->
  <div class="big-word" style="left: 3%; top: 12%;">
    <span class="paren">(</span>Juliana
  </div>
 
  <!-- Shi -->
  <div class="big-word" style="left: 3%; top: 35%;">Shi</div>
 
  <!-- ( bottom-left area -->
  <div class="big-word" style="left: 57%; top: 45%;">
    <span class="paren">(</span>
  </div>
 
  <!-- Particular — far right -->
  <div class="big-word" style="right: 4%; top: 46%; text-align: right;">FOODIE</div>
 
  <!-- (Order — bottom centre -->
  <div class="big-word" style="left: 34%; bottom: 2%;">
    <span class="paren">(</span>Coder
  </div>
 
  <!-- Floating parentheses -->
  <div class="big-word paren" style="left: 19%; top: 34%;"><span class="paren">)</span></div>
  <div class="big-word paren" style="left: 96%; top: 45%;"><span class="paren">)</span></div>
  <div class="big-word paren" style="right: 34%; bottom: 2%;"><span class="paren">)</span></div>
 
  <!-- ── Photos ──
       Replace the <div class="photo ph-*"> elements with:
       <div class="photo" style="...same inline style...">
         <img src="your-image.jpg" alt="">
       </div>
  -->
 

  <!-- Dark interior geometric -->
  <div class="photo ph-dark-blue"
       style="width:11%; aspect-ratio:4/3; left:48%; top:26%; transform:rotate(-1deg);"></div>
 
  <!-- City / street wide -->
  <div class="photo ph-blue-grey"
       style="width:13%; aspect-ratio:16/9; left:34%; top:40%;"></div>
 
  <!-- Coloured portrait -->
  <div class="photo ph-coral"
       style="width:9%; aspect-ratio:3/4; left:58%; top:3%;"></div>
 
  <!-- Moody portrait, right -->
  <div class="photo ph-mauve"
       style="width:9%; aspect-ratio:4/5; right:15%; top:8%;"></div>
 
  <!-- Hands / abstract b&w -->
  <div class="photo ph-silver"
       style="width:10%; aspect-ratio:4/3; right:3%; top:28%;"></div>
 
  <!-- Tiny dark portrait -->
  <div class="photo ph-near-black"
       style="width:5%; aspect-ratio:2/3; left:46%; top:5%;"></div>
 
  <!-- Lab / machine equipment -->
  <div class="photo ph-light-blue"
       style="width:13%; aspect-ratio:4/3; left:5%; bottom:18%;"></div>
 
  <!-- Dark street landscape -->
  <div class="photo ph-charcoal"
       style="width:9%; aspect-ratio:16/9; left:18%; bottom:20%;"></div>

  <!-- ── Bottom labels ── -->
  <div class="label-bottom-left">Welcome!</div>
  <div class="label-bottom-right">
    <strong>Hello!</strong>
    This is my personal portfolio<br>
    Technologist, designer, product-oriented
  </div>
 
</div>
</body>
</html>
